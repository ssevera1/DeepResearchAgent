[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A cyclic deep research agent built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.0",
    "tavily-python>=0.5.0",
    # Imported directly by src/agents/graph.py. Both resolve today only as
    # transitive dependencies of langchain-core / ollama; declare them so a
    # reshuffle upstream cannot break import at startup.
    "tenacity>=8.1.0,<10.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
deep-research = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
